[package]
name = "aint-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Tree-walk interpreter and execution engine for AINT: deterministic execution, model adapters, tool dispatch, and tracing."

[dependencies]
aint-ast = { path = "../ast" }
tokio = { version = "1", features = ["full"] }
# The interpreter's core eval methods are mutually recursive async fns
# (`await` can appear anywhere an expression can, so the whole call
# graph has to be async). Rust rejects naive recursive async fn since
# the returned future's type would be infinitely sized; this crate
# boxes the recursive call sites for us. `?Send` because Value holds
# `Rc`/`RefCell` throughout and is never spawned onto another thread —
# see docs/milestones/07-async-concurrency/SPEC.md.
async-recursion = "1"
# Backs `distribution_sample` only (milestone 10) — a weighted random
# draw over a Distribution<T>'s reported probabilities.
rand = "0.8"
# Backs `HttpModel` only (milestone 16) — the one real network call
# anywhere in this crate. native-tls (the OS's own TLS: SChannel on
# Windows, Secure Transport on macOS, OpenSSL on Linux) instead of
# rustls: rustls's `ring` dependency needs a working C toolchain to
# build its assembly, which isn't available on every dev machine this
# targets; native-tls needs no C compiler on Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Backs `auth_hash_password`/`auth_verify_password` only (milestone
# 25) — real password hashing, not a hand-rolled scheme, for the one
# native this codebase has that touches actual credentials. Pure Rust,
# no C toolchain dependency (the same constraint that ruled out
# `rustls`/`ring` in favor of `native-tls` above).
bcrypt = "0.15"

[dev-dependencies]
# Only for tests: makes it possible to write test programs as AINT
# source text instead of hand-building AST trees. The interpreter
# itself only ever depends on aint-ast, matching the pipeline direction
# in docs/ARCHITECTURE.md.
aint-parser = { path = "../parser" }
