[package]
name = "aint-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AINT Intermediate Representation (AIR): lowers the typed AST into a form the runtime can execute and optimize."

[dependencies]
aint-ast = { path = "../ast" }

[dev-dependencies]
# Only for tests: lets lowering tests be written as AINT source text
# instead of hand-built AST trees, and type-checked first so tests
# reflect what lowering actually receives in practice. Matches the
# pattern already established in aint-runtime/aint-typechecker's own
# tests.
aint-parser = { path = "../parser" }
aint-typechecker = { path = "../typechecker" }
