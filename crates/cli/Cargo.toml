[package]
name = "aint"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command-line tool for the AINT programming language: aint run / build / test / fmt."
default-run = "aint"

[[bin]]
name = "aint"
path = "src/main.rs"

[dependencies]
aint-ast = { path = "../ast" }
aint-lexer = { path = "../lexer" }
aint-typechecker = { path = "../typechecker" }
aint-ir = { path = "../ir" }
aint-runtime = { path = "../runtime" }
aint-vm = { path = "../vm" }
aint-package = { path = "../package" }
aint-loader = { path = "../loader" }
aint-fmt = { path = "../fmt" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
# Backs `aint upgrade` only (milestone 42) - the same version/features
# `aint-runtime`'s `HttpModel` already pulls in, so this adds no new
# dependency to the graph, just a second, blocking use of one already
# there. `blocking` spins up its own internal runtime, so `upgrade()`
# needs no `tokio::runtime::Runtime` of its own the way `run`/`test` do.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
# Backs the CLI's own colored, verbose output (milestone 43) - both
# already sit in the dependency graph regardless, via clap's own
# `--help` coloring, so this adds nothing new to build. `anstream`
# auto-detects a non-terminal destination (a pipe, a file, `NO_COLOR`)
# and strips ANSI codes itself - callers never need to check for that.
anstream = "1"
anstyle = "1"
