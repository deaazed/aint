[package]
name = "aint"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command-line tool for the AINT programming language: aint run / build / test / fmt."
default-run = "aint"

[[bin]]
name = "aint"
path = "src/main.rs"

[dependencies]
aint-ast = { path = "../ast" }
aint-lexer = { path = "../lexer" }
aint-typechecker = { path = "../typechecker" }
aint-ir = { path = "../ir" }
aint-runtime = { path = "../runtime" }
aint-vm = { path = "../vm" }
aint-package = { path = "../package" }
aint-loader = { path = "../loader" }
aint-fmt = { path = "../fmt" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
